[package]
name = "forge"
version = "1.0.0"
edition = "2021"

[dependencies]
crossterm = "0.29"
libc = "0.2"
# Markdown answers in the walkthrough Q&A panel (its code fences take
# the stylesheet code style; tour source highlighting is syntect below).
tui-markdown = { version = "0.3.9", default-features = false }
# Walkthrough code highlighting: Sublime grammars via a pure-Rust regex
# engine (no onig C build). Scopes map onto a static OneDark-style
# palette in walkthrough::code, deliberately ignoring the OS theme.
syntect = { version = "5.3", default-features = false, features = ["default-syntaxes", "regex-fancy"] }
portable-pty = "0.8"
ratatui = "0.30"
regex = "1"
serde_json = "1"
toml = "1"
tui-realm-stdlib = "4.1.0"
tuirealm = "4.1.0"
# Vendored 0.15.2 + faint (SGR 2) patch; see vendor/vt100/FORGE-PATCHES.md.
vt100 = { path = "vendor/vt100" }
# Mermaid diagrams for the Visual tab (U1 spike): library only, no CLI.
mermaid-rs-renderer = { version = "0.3", default-features = false, features = ["png"], optional = true }
# PNG decode for the half-block fallback (pure Rust).
png = { version = "0.17", optional = true }

[features]
default = ["visual"]
visual = ["mermaid-rs-renderer/png", "png"]

[package]
name = "forge"
version = "1.0.0"
edition = "2021"

[dependencies]
crossterm = "0.29"
libc = "0.2"
# Markdown answers in the walkthrough Q&A panel; no syntax highlighter
# (code fences take the stylesheet code style instead).
tui-markdown = { version = "0.3.9", default-features = false }
portable-pty = "0.8"
ratatui = "0.30"
regex = "1"
serde_json = "1"
toml = "1"
tui-realm-stdlib = "4.1.0"
tuirealm = "4.1.0"
# Vendored 0.15.2 + faint (SGR 2) patch; see vendor/vt100/FORGE-PATCHES.md.
vt100 = { path = "vendor/vt100" }
